services:
  flower:
    image: mher/flower:2.1.0
    command: ["celery", "--config=flowerconfig", "flower"]
    environment:
      CELERY_BROKER_URL: amqp://production_control:production_control@rabbitmq:5672//
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:local-flower-password}
      PYTHONPATH: /etc/flower
      TZ: Asia/Yekaterinburg
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./flowerconfig.py:/etc/flower/flowerconfig.py:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: production_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: production_control
      RABBITMQ_DEFAULT_PASS: production_control
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-production_control}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    build:
      context: .
      dockerfile: docker/minio-init.Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-production_control}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      MINIO_IMPORT_RETENTION_DAYS: ${MINIO_IMPORT_RETENTION_DAYS:-7}
      MINIO_EXPORT_RETENTION_DAYS: ${MINIO_EXPORT_RETENTION_DAYS:-7}
      MINIO_REPORT_RETENTION_DAYS: ${MINIO_REPORT_RETENTION_DAYS:-30}
    restart: "no"

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
