[project]
name = "production-control"
version = "0.1.0"
description = ""
authors = [
    {name = "NEVERMIND",email = "evr15062015@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "minio (>=7.2.0,<8.0.0)",
    "urllib3 (>=2.0.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "loguru (>=0.7.3,<0.8.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "types-openpyxl (>=3.1.5.20260827,<4.0.0.0)",
    "celery-types (>=0.26.0,<0.27.0)"
]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
show_error_codes = true
disallow_untyped_defs = true
